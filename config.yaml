# ============================================================
# AI Coding Agent 配置文件
# ============================================================

llm:
  # 千问 API 配置（兼容 OpenAI SDK）
  api_key: "${QWEN_API_KEY}"          # 从环境变量读取
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-coder-plus"
  temperature: 0.1                     # 0~2，越低越确定
  max_tokens: 8192

agent:
  max_iterations: 30                   # 最大工具调用轮数，防止死循环
  workspace_root: "."                  # 文件操作的根目录（路径白名单基准）

tools:
  file:
    enabled: true
    max_file_size_mb: 5               # 单文件读取上限
  shell:
    enabled: true
    timeout_seconds: 60               # 命令执行超时
    # 危险命令黑名单（正则匹配）
    dangerous_patterns:
      - "rm\\s+(-rf?\\s+)?/"
      - "shutdown"
      - "reboot"
      - "mkfs\\."
      - "dd\\s+if="
      - ">\\s*/dev/sd"
      - ":(){ :|:& };:"               # fork bomb
  git:
    enabled: true
    protected_branches:               # 禁止强制推送到这些分支
      - "main"
      - "master"
      - "release/*"
  search:
    enabled: true
    exclude_dirs:                      # 搜索时排除的目录
      - ".git"
      - "node_modules"
      - "__pycache__"
      - ".venv"
      - "venv"
      - "dist"
      - "build"

logging:
  level: "INFO"                        # DEBUG | INFO | WARNING | ERROR
  file: "agent.log"                    # 日志文件路径
  format: "json"                       # json | text
  # 是否同时输出到终端
  console: true

# ============================================================
# 自进化记忆系统
# ============================================================
memory:
  enabled: true                           # 是否启用记忆功能
  max_context_tokens: 800                 # 记忆注入的 Token 上限
  data_dir: "data/memories"               # 记忆持久化目录
  async_reflection: true                  # 是否异步生成详细经验（推荐 true）

# ============================================================
# 分层上下文压缩系统
# ============================================================
context:
  enabled: true                           # 是否启用上下文压缩
  max_tokens: 9000                        # 触发压缩的 Token 阈值
  keep_recent: 8                          # 压缩时保留的最近消息数

  placeholder:
    file_threshold_chars: 3000            # 文件内容超过此字符数触发占位替换
    output_threshold_chars: 2000          # 命令输出超过此字符数触发占位替换
    keep_head_lines: 30                   # 占位替换时保留的开头行数
    keep_head_chars: 500                  # 占位替换时保留的开头字符数

  note:
    enabled: true                         # 是否启用结构化笔记
    use_llm_fallback: false               # 是否在规则无法覆盖时回退到 LLM 生成笔记

  summary:
    enabled: true                         # 是否启用 LLM 摘要压缩
    max_chars: 300                        # 摘要最大字符数

# ============================================================
# 中心化多Agent协作系统
# ============================================================
multi_agent:
  enabled: true                             # 是否启用多Agent协作模式
  parallel_workers: 4                       # 最大并行子Agent数
  sub_agent_max_iterations: 15              # 子Agent最大迭代轮次
  worktree_enabled: true                    # 是否启用Git Worktree隔离

# ============================================================
# 权限与安全审查系统
# ============================================================
security:
  enabled: true                             # 是否启用安全审查链路
  tier: "standard"                          # 安全等级: relaxed(宽松) | standard(标准) | strict(严格)
  enable_ai_classifier: true                # 是否启用AI风险检测
  enable_human_gate: true                   # 是否启用人工确认门禁
  confirm_timeout: 120.0                    # 人工确认超时秒数（超时默认拒绝）
  auto_confirm: false                       # CI/自动化模式（跳过人工确认）
  audit_log: "data/audit.log"               # 审查日志文件路径
  # 额外敏感文件模式（追加到默认列表）
  extra_sensitive_patterns: []
    # - "*.prod.yml"
    # - "production.key"
  # 硬阻止工具列表（任何安全等级都生效）
  blocked_tools: []
    # - "some_dangerous_tool"

